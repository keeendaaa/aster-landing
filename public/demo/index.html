<div class="phase-list"><button data-phase="0" data-time="0" class="phase-step"><span>01</span>Подлёт</button><button data-phase="1" data-time="5" class="phase-step"><span>02</span>По звёздам</button><button data-phase="2" data-time="10" class="phase-step"><span>03</span>Сближение</button><button data-phase="3" data-time="15" class="phase-step"><span>04</span>Посадка</button><button data-phase="4" data-time="20" class="phase-step"><span>05</span>Фиксация</button></div>
<figcaption><p><span class="caption-lead">Ориентация — не точное позиционирование.</span> При подлёте показана связь со звёздами. К началу сближения она исчезает: расстояние до объекта и посадка требуют отдельных средств локального наведения и не гарантируются Aster. Захват и посадка показаны условно.</p><span class="caption-index">SVG / 24 SEC<br>ИНТЕРАКТИВНЫЙ МАКЕТ</span></figcaption>
</figure><footer><span>КОНЦЕПТУАЛЬНАЯ ВИЗУАЛИЗАЦИЯ · НЕ РУКОВОДСТВО К ПОЛЁТАМ У ЛЭП</span><span>ЗВЁЗДЫ УСЛОВНЫЕ · МАСШТАБ МАКЕТНЫЙ</span></footer><p class="sr-only" aria-live="polite" id="announce"></p></main>
<script type="module">document.body.dataset.embedded=String(window.self!==window.top);
const DURATION = 24;
const SPAN = 311.6;
const WIRE_Y = 38;
const LAND_X = 20;
const PHASES = [
  { at: 0, name: 'Подлёт', sub: 'Ориентация по звёздам на маршруте' },
  { at: 5, name: 'По звёздам', sub: 'Определение ориентации' },
  { at: 10, name: 'Сближение', sub: 'Локальное оптическое наведение' },
  { at: 15, name: 'Посадка', sub: 'Совмещение седла с проводом' },
  { at: 20, name: 'Фиксация', sub: 'Захват закрыт · винты остановлены' },
];
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const mix = (a, b, t) => a + (b - a) * t;
const wireZ = x => {
  const a = Math.abs(x);
  if (a <= 148) return 168 - 24 * (1 - (x / 158) ** 2);
  if (a >= 154.3) return 168;
  const u = (a - 148) / 6.3, z0 = 168 - 24 * (1 - (148 / 158) ** 2);
  const slope = 48 * 148 / (158 ** 2);
  return (2*u**3-3*u**2+1)*z0 + (u**3-2*u**2+u)*6.3*slope + (-2*u**3+3*u**2)*168;
};
const lerp3 = (a, b, t) => a.map((v, i) => mix(v, b[i], t));
function stateAt(time) {
  const t = Math.max(0, Math.min(DURATION, time));
  const end = [LAND_X, WIRE_Y, wireZ(LAND_X)];
  let position;
  if (t < 5) position = lerp3([-310, 95, 174], [-60, 95, 174], ease(t / 5));
  else if (t < 10) position = [-60, 95, 174 + Math.sin((t - 5) * Math.PI / 5) * 1.2];
  else if (t < 15) position = lerp3([-60, 95, 174], [LAND_X, WIRE_Y, end[2] + 24], ease((t - 10) / 5));
  else if (t < 20) position = lerp3([LAND_X, WIRE_Y, end[2] + 24], end, ease((t - 15) / 5));
  else position = end;
  const phase = PHASES.reduce((index, p, i) => t >= p.at ? i : index, 0);
  const starLock = ease(t / 1.2) * (1 - ease((t - 9) / 1));
  const closed = ease((t - 20) / 1.4);
  const rpm = 1 - ease((t - 21.4) / 1.8);
  return { t, phase, position, starLock, closed, rpm,
    clearance: Math.max(0, position[2] - wireZ(position[0])),
    opacity: ease(t / 1.2),
    rotorAngle: t < 21.4 ? t * 23 : 21.4 * 23 + 23 * 1.8 * (() => { const u = clamp01((t - 21.4) / 1.8); return u - 2.5*u**4 + 3*u**5 - u**6; })(),
  };
}

const PROJECTION={"origin":[500,472.5849619917107],"scale":1.0042472177267305,"azimuth":62,"elevation":25};
const NAV_STARS=[[337,64],[496,105],[594,46]];
const stage = document.querySelector('.iso-stage');
const drone = document.querySelector('#drone');
const world = document.querySelector('#world');
const infrastructure = [...world.querySelectorAll('.world-part')];
const rotors = [...document.querySelectorAll('[data-rotor]')];
const jaws = [...document.querySelectorAll('[data-jaw]')];
const haze = [...document.querySelectorAll('.rotor-haze')];
const nav = document.querySelector('#star-nav');
const sight = document.querySelector('#sight');
const phaseText = document.querySelector('#phase');
const readout = document.querySelector('[data-readout]');
const slider = document.querySelector('#timeline');
const clock = document.querySelector('#clock');
const play = document.querySelector('#play');
const steps = [...document.querySelectorAll('[data-phase]')];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const radians = Math.PI / 180;
const ca = Math.cos(PROJECTION.azimuth * radians), sa = Math.sin(PROJECTION.azimuth * radians);
const ce = Math.cos(PROJECTION.elevation * radians), se = Math.sin(PROJECTION.elevation * radians);
const unit = PROJECTION.scale * Math.sqrt(1.6);
const project = ([x,y,z]) => [PROJECTION.origin[0]+(x*sa-y*ca)*unit, PROJECTION.origin[1]+((x*ca+y*sa)*se-z*ce)*unit];
const path = points => points.map((p,i)=>(i?'L':'M')+p.map(v=>v.toFixed(3)).join(' ')).join('')+'Z';
let time = reduced.matches ? DURATION : 0;
let playing = !reduced.matches, visible = true, last = 0, raf = 0, lastPhase = -1, slot = -1;
let loopWait = 0, manuallyPaused = false;
function show() {
  const s=stateAt(time), screen=project(s.position);
  drone.setAttribute('transform',`translate(${screen[0]} ${screen[1]})`);
  drone.setAttribute('opacity',s.opacity*(1-ease((loopWait-2.8)/.8)));
  const depth=(s.position[0]*ca+s.position[1]*sa)*ce+(s.position[2]+10)*se;
  const nextSlot=infrastructure.findIndex(el=>Number(el.dataset.depth)>depth);
  if(nextSlot!==slot) { world.insertBefore(drone,nextSlot<0?null:infrastructure[nextSlot]); slot=nextSlot; }
  for(const rotor of rotors) {
    const x=Number(rotor.dataset.cx),y=Number(rotor.dataset.cy);
    const angle=s.rotorAngle*Number(rotor.dataset.rotor);
    [...rotor.children].forEach((blade,i)=>{
      const a=angle+i*Math.PI;
      const points=[[1.1,-1.2],[12.5,-.65],[13.2,.5],[3,1.5]].map(([u,v])=>project([x+u*Math.cos(a)-v*Math.sin(a),y+u*Math.sin(a)+v*Math.cos(a),17.5]));
      blade.setAttribute('d',path(points));
    });
  }
  jaws.forEach(jaw=>{
    const sy=Number(jaw.dataset.jaw), a=project([0,-sy*s.closed*1.5,0]);
    jaw.setAttribute('transform',`translate(${a[0]-PROJECTION.origin[0]} ${a[1]-PROJECTION.origin[1]})`);
  });
  haze.forEach(el=>el.setAttribute('opacity',reduced.matches?0:s.rpm*.16));
  nav.setAttribute('opacity',s.starLock);
  const sensor=project([s.position[0]+4,s.position[1]-1,s.position[2]+22.8]);
  sight.setAttribute('d',NAV_STARS.map(([x,y])=>`M${x} ${y}L${sensor[0]} ${sensor[1]}`).join(''));
  phaseText.textContent=PHASES[s.phase].name;
  readout.textContent=s.t>=20 ? (s.closed>=.999?'ЗАХВАТ ЗАКРЫТ':'ФИКСАЦИЯ ЗАХВАТА') : s.phase===3 ? `ДО КОНТАКТА ${s.clearance.toFixed(1)} · ЕД.` : `ВЫСОТА ${s.position[2].toFixed(1)} · ЕД. МАКЕТА`;
  slider.value=String(time);
  slider.style.setProperty('--progress',`${time/DURATION*100}%`);
  clock.textContent='00:'+String(Math.floor(time)).padStart(2,'0');
  steps.forEach((step,i)=>{ step.dataset.active=String(i===s.phase); step.setAttribute('aria-current',i===s.phase?'step':'false'); });
  if(s.phase!==lastPhase) {
    if(lastPhase>=0) document.querySelector('#announce').textContent=PHASES[s.phase].name+'. '+PHASES[s.phase].sub;
    lastPhase=s.phase;
  }
  document.body.dataset.phase=String(s.phase);
  document.body.dataset.time=time.toFixed(3);
  document.querySelector('#play-icon').textContent=playing?'Ⅱ':'▶';
  play.setAttribute('aria-label',playing?'Приостановить анимацию':'Воспроизвести анимацию');
}
function frame(now) {
  raf=0;
  const dt=last?Math.min((now-last)/1000,1/30):0;
  last=now;
  if(playing && !document.hidden && visible) {
    if(time<DURATION) time=Math.min(DURATION,time+dt);
    else { loopWait+=dt; if(loopWait>3.6) { time=0;loopWait=0; } }
    show();
  }
  if(playing && visible && !document.hidden) raf=requestAnimationFrame(frame);
}
function run() { if(!raf && playing && visible && !document.hidden) {last=0;raf=requestAnimationFrame(frame);} }
function setPlaying(value) { playing=value;manuallyPaused=!value;show();run(); }
function seek(value, pause=true) {
  time=Math.max(0,Math.min(DURATION,value));loopWait=0;
  if(pause) {playing=false;manuallyPaused=true;}
  show();run();
}
play.addEventListener('click',()=>{if(!playing && time===DURATION) time=0;setPlaying(!playing);});
document.querySelector('#replay').addEventListener('click',()=>{seek(0,false);setPlaying(!reduced.matches);});
slider.addEventListener('input',()=>seek(Number(slider.value)));
steps.forEach(step=>step.addEventListener('click',()=>seek(Number(step.dataset.time))));
stage.addEventListener('keydown',event=>{
  if(event.key===' ' || event.key==='Enter') {event.preventDefault();setPlaying(!playing);}
  else if(event.key==='ArrowRight' || event.key==='ArrowLeft') {event.preventDefault();seek(time+(event.key==='ArrowRight'?1:-1));}
  else if(event.key==='Home' || event.key==='End') {event.preventDefault();seek(event.key==='Home'?0:DURATION);}
});
document.querySelector('#theme').addEventListener('click',()=>{
  const theme=document.body.dataset.theme==='dark'?'light':'dark';
  document.body.dataset.theme=theme;
  document.querySelector('#theme').innerHTML=(theme==='dark'?'Светлая':'Тёмная')+' тема <span aria-hidden="true">◐</span>';
});
new IntersectionObserver(entries=>{visible=entries.at(-1).isIntersecting;run();},{rootMargin:'80px'}).observe(stage);
document.addEventListener('visibilitychange',run);
reduced.addEventListener('change',()=>{if(reduced.matches) {playing=false;time=DURATION;show();} else if(!manuallyPaused) setPlaying(true);});
// Deterministic test/recording hook: shares the exact production model.
window.starline={seek:value=>seek(value),state:()=>stateAt(time),play:()=>setPlaying(true),pause:()=>setPlaying(false)};
show();run();
</script></body></html>
